<script src="assets/audio.js?v=20261126-r1"></script>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("glCanvas");
  const statsEl = document.getElementById("statsReadout");
  const curtainSlider = document.getElementById("curtainSlider");
  const curtainHandle = document.getElementById("curtainHandle");
  const btnAudio = document.getElementById("btnAudio");
  const btnLang = document.getElementById("btnLang");

  let isEn = (new URLSearchParams(location.search).get("lang") || "").toLowerCase() === "en";
  let engine = null;

  try {
    engine = ShanHaiEngine.create(canvas, (st) => {
      statsEl.textContent = `${st.tris.toLocaleString()} TRIS · ${st.fps} FPS`;
    });
  } catch (err) {
    const div = document.createElement("div");
    div.className = "fallback-msg";
    div.innerHTML = `<div><h2>WebGL2 Required</h2><p>${err.message}</p></div>`;
    document.body.appendChild(div);
    return;
  }

  function applyLang() {
    document.documentElement.lang = isEn ? "en" : "zh-Hant";
    btnLang.textContent = isEn ? "繁中" : "EN";
    document.querySelectorAll("[data-zh]").forEach((el) => {
      if (el === btnAudio) return;
      el.textContent = isEn ? el.dataset.en : el.dataset.zh;
    });
    syncAudioBtn();
  }

  function syncAudioBtn() {
    const on = ShanHaiAudio.isPlaying();
    btnAudio.classList.toggle("accent-on", on);
    btnAudio.textContent = isEn ? (on ? "Guqin: ON" : "Guqin: OFF") : (on ? "撫琴：開" : "撫琴：關");
  }

  function syncBodyState() {
    document.body.classList.toggle("is-entered", engine.state.entered);
    document.body.classList.toggle("mood-night", engine.state.style === "night");
    document.querySelectorAll("[data-mode]").forEach((b) => {
      b.classList.toggle("active", b.dataset.mode === engine.state.mode);
    });
    document.querySelectorAll("[data-style]").forEach((b) => {
      b.classList.toggle("active", b.dataset.style === engine.state.style);
    });
    const wirePct = Math.round((1 - engine.state.targetCurtain) * 100);
    curtainSlider.value = String(wirePct);
    const activeSplit = wirePct > 2 && wirePct < 98;
    curtainHandle.classList.toggle("visible", activeSplit);
    curtainHandle.style.left = `${(100 - wirePct)}%`;
  }

  engine.setOnAutoEnter(syncBodyState);

  document.getElementById("btnEnter").addEventListener("click", () => {
    engine.enterScroll();
    ShanHaiAudio.playEnterChime();
    syncBodyState();
  });

  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      engine.setMode(btn.dataset.mode);
      syncBodyState();
    });
  });

  document.querySelectorAll("[data-style]").forEach((btn) => {
    btn.addEventListener("click", () => {
      engine.setStyle(btn.dataset.style);
      syncBodyState();
    });
  });

  curtainSlider.addEventListener("input", () => {
    const wirePct = Number(curtainSlider.value);
    engine.setCurtain(1 - wirePct / 100);
    if (!engine.state.entered && wirePct > 0) engine.state.entered = true;
    syncBodyState();
  });

  btnAudio.addEventListener("click", () => {
    ShanHaiAudio.toggle();
    syncAudioBtn();
  });

  btnLang.addEventListener("click", () => {
    isEn = !isEn;
    applyLang();
  });

  // Keyboard shortcut: X toggles 50% wireframe split curtain!
  window.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "x") {
      const next = engine.state.targetCurtain > 0.75 ? 0.5 : 1.0;
      engine.setCurtain(next);
      engine.state.entered = true;
      syncBodyState();
    }
  });

  applyLang();
  syncBodyState();
})();
</script>
