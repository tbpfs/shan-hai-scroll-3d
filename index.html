<script>
(() => {
  "use strict";
  const canvas = document.getElementById("glCanvas");
  const body = document.body;
  const statsEl = document.getElementById("statsReadout");
  const curtainSlider = document.getElementById("curtainSlider");
  const curtainHandle = document.getElementById("curtainHandle");
  const btnAudio = document.getElementById("btnAudio");
  const btnLang = document.getElementById("btnLang");
  const btnHudToggle = document.getElementById("btnHudToggle");
  const btnEnter = document.getElementById("btnEnter");
  const btnReset = document.getElementById("btnReset");
  const regionToast = document.getElementById("regionToast");
  let toastTimer = null;

  function showRegion(reg) {
    regionToast.textContent = lang === "en" ? reg.en : reg.zh;
    regionToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => regionToast.classList.remove("show"), 3200);
  }

  let lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
  let audioOn = false;
  let hudHidden = false;

  function updateHudToggleLabel() {
    btnHudToggle.textContent = lang === "en"
      ? (hudHidden ? "Show UI" : "Hide UI")
      : (hudHidden ? "顯鏡" : "藏鏡");
    btnHudToggle.setAttribute("aria-pressed", String(hudHidden));
    body.classList.toggle("hud-hidden", hudHidden);
  }

  function applyLang() {
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
    btnLang.textContent = lang === "en" ? "繁中" : "EN";
    document.querySelectorAll("[data-zh]").forEach((el) => {
      if (el === btnAudio || el === btnHudToggle) return;
      el.textContent = lang === "en" ? el.dataset.en : el.dataset.zh;
    });
    updateAudioLabel();
    updateHudToggleLabel();
  }

  function updateAudioLabel() {
    btnAudio.textContent = lang === "en"
      ? (audioOn ? "Guqin: ON" : "Guqin: OFF")
      : (audioOn ? "撫琴：開" : "撫琴：關");
    btnAudio.classList.toggle("active", audioOn);
  }

  function syncModeButtons(mode) {
    document.querySelectorAll("[data-mode]").forEach((b) => {
      const isActive = b.dataset.mode === mode;
      b.classList.toggle("active", isActive);
      if (isActive && window.innerWidth <= 640 && b.scrollIntoView) {
        try { b.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }); } catch (_) {}
      }
    });
  }

  function syncStyleButtons(style) {
    document.querySelectorAll("[data-style]").forEach((b) => b.classList.toggle("active", b.dataset.style === style));
  }

  function syncCurtainUI(curtainFrac) {
    const pct = Math.round((1 - curtainFrac) * 100);
    curtainSlider.value = String(pct);
    const active = curtainFrac > 0.03 && curtainFrac < 0.97;
    curtainHandle.classList.toggle("visible", active);
    const margin = window.innerWidth <= 640 ? 22 : 12;
    const clampedPct = Math.max(margin, Math.min(100 - margin, curtainFrac * 100));
    curtainHandle.style.left = clampedPct.toFixed(2) + "%";
  }

  function markEntered() {
    body.classList.add("is-entered");
  }

  const engine = ShanHaiEngine.create(canvas, {
    onEnter: markEntered,
    onModeChange: syncModeButtons,
    onRegion: showRegion,
    onStats: ({ fps, tris }) => {
      const fpsPart = fps >= 15 ? ` · ${fps} FPS` : "";
      statsEl.textContent = `${tris.toLocaleString()} TRIS${fpsPart}`;
    }
  });

  // Sync URL query params into UI state
  if (engine.state.entered) markEntered();
  syncModeButtons(engine.state.mode);
  syncStyleButtons(engine.state.style);
  syncCurtainUI(engine.state.curtain);

  btnEnter.addEventListener("click", () => {
    markEntered();
    engine.enterScroll();
  });

  btnReset.addEventListener("click", () => {
    markEntered();
    engine.resetView();
    syncModeButtons("free");
  });

  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      markEntered();
      engine.setMode(btn.dataset.mode);
      syncModeButtons(btn.dataset.mode);
    });
  });

  document.querySelectorAll("[data-style]").forEach((btn) => {
    btn.addEventListener("click", () => {
      markEntered();
      engine.setStyle(btn.dataset.style);
      syncStyleButtons(btn.dataset.style);
    });
  });

  curtainSlider.addEventListener("input", () => {
    markEntered();
    const frac = 1.0 - Number(curtainSlider.value) / 100.0;
    engine.setCurtain(frac);
    syncCurtainUI(frac);
  });

  btnAudio.addEventListener("click", () => {
    audioOn = ShanHaiAudio.toggle();
    updateAudioLabel();
  });

  btnLang.addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    applyLang();
  });

  btnHudToggle.addEventListener("click", () => {
    hudHidden = !hudHidden;
    updateHudToggleLabel();
  });

  window.addEventListener("resize", () => syncCurtainUI(engine.state.targetCurtain));

  // Keyboard shortcuts: X toggles 50% 3D X-Ray split curtain; R resets view; H toggles HUD; 1/2/3 switch moods
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "x") {
      markEntered();
      const next = engine.state.targetCurtain > 0.75 ? 0.5 : 1.0;
      engine.setCurtain(next);
      syncCurtainUI(next);
    } else if (k === "r") {
      markEntered();
      engine.resetView();
      syncModeButtons("free");
    } else if (k === "h") {
      markEntered();
      hudHidden = !hudHidden;
      updateHudToggleLabel();
    } else if (k === "1") {
      engine.setStyle("bluegreen"); syncStyleButtons("bluegreen");
    } else if (k === "2") {
      engine.setStyle("mono"); syncStyleButtons("mono");
    } else if (k === "3") {
      engine.setStyle("night"); syncStyleButtons("night");
    }
  });

  applyLang();
})();
</script>
